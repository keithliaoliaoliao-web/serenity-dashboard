name: Serenity 每小時更新

on:
  schedule:
    # 每小時第 7 分執行（避開整點的 GitHub 排程壅塞）
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      target_count:
        description: '本次最多分析幾則推文（預設 50）'
        required: false
        default: '50'
        type: string
      thesis_count:
        description: '本次最多重新整理幾檔個股論點（預設 15）'
        required: false
        default: '15'
        type: string
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/build_dashboard.yml'

permissions:
  contents: write

# 同一時間只允許一個更新在跑，避免兩個流程同時寫回 GitHub 而互相打架
concurrency:
  group: serenity-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install requests yfinance

      - name: 1. 抓取推文
        continue-on-error: true
        env:
          TWITTER_AUTH_TOKEN: ${{ secrets.TWITTER_AUTH_TOKEN }}
          TWITTER_CT0: ${{ secrets.TWITTER_CT0 }}
        run: python scripts/fetch_tweets.py

      - name: 2. Gemini 推文情緒分析
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TOTAL_TARGET: ${{ inputs.target_count || '50' }}
        run: python scripts/analyze_sentiment.py

      - name: 3. Gemini 個股論點整理
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THESIS_MAX_PER_RUN: ${{ inputs.thesis_count || '15' }}
        run: python scripts/generate_thesis.py

      - name: 4. 產出儀表板
        run: python scripts/build_html.py

      - name: 5. 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/
          if git diff --staged --quiet; then
            echo "沒有任何變動，跳過提交。"
          else
            git commit -m "chore: 自動更新推文、AI 分析、論點與儀表板 [skip ci]"
            for i in 1 2 3; do
              git pull origin main --rebase -X theirs && git push origin main && break
              echo "推送失敗，5 秒後重試 ($i/3)"
              sleep 5
            done
          fi
