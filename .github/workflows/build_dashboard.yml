name: 產生並部署儀表板

on:
  schedule:
    # 每天台灣時間 08:00 與 20:00 自動排程執行
    - cron: '0 0,12 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/build_dashboard.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 儲存庫
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 同步 yan-labs 最新推文存檔
        run: |
          echo "🔄 檢查 yan-labs 最新資料..."
          curl -fL "https://raw.githubusercontent.com/yan-labs/serenity-aleabitoreddit/main/data/aleabitoreddit_tweets.json" -o data/tweets_upstream.json || true
          if [ -f data/tweets_upstream.json ]; then
            if [ -s data/tweets_upstream.json ]; then
              mv data/tweets_upstream.json data/tweets.json
              echo "✅ 資料更新成功"
            else
              rm data/tweets_upstream.json
            fi
          fi

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 Gemini 套件
        run: |
          pip install google-generativeai

      - name: 執行 Gemini 情緒深度分析
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/analyze_sentiment.py

      - name: 執行編譯腳本產出 HTML
        run: |
          python scripts/build_html.py

      - name: 提交更新至 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add data/sentiment_cache.json docs/index.html data/tweets.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: 更新 AI 快取與儀表板 [skip ci]"
            git push origin main
          fi

      - name: 上傳 Pages 產出檔案
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 直接部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
