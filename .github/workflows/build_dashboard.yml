name: 產生並部署儀表板

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'data/tweets.json'
      - 'scripts/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout 儲存庫
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 同步 yan-labs 最新推文存檔
        run: |
          echo "🔄 檢查 yan-labs 最新資料..."
          curl -fL "https://raw.githubusercontent.com/yan-labs/serenity-aleabitoreddit/main/data/aleabitoreddit_tweets.json" -o data/tweets_upstream.json || true
          if [ -f data/tweets_upstream.json ]; then
            if [ -s data/tweets_upstream.json ]; then
              mv data/tweets_upstream.json data/tweets.json
              echo "✅ 資料更新成功"
            else
              rm data/tweets_upstream.json
            fi
          fi

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 Gemini 套件
        run: |
          pip install google-generativeai

      - name: 執行 Gemini 情緒深度分析
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/analyze_sentiment.py

      - name: 執行編譯腳本產出 HTML
        run: |
          python scripts/build_html.py

      - name: 提交更新至 repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add data/sentiment_cache.json docs/index.html data/tweets.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: 更新 AI 情緒快取與儀表板 HTML"
            git push origin main
          fi
